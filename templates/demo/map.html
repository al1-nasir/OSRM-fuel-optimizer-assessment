<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuel Route Planner — Interactive Dashboard</title>
    <meta name="description" content="Production-grade fuel route optimization dashboard with interactive Leaflet map and dynamic cost breakdowns.">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin="" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: #131c2e;
            --bg-card: #1a243b;
            --bg-hover: #22304e;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --success-glow: rgba(16, 185, 129, 0.15);
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #26334d;
            --radius: 10px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            overflow: hidden;
        }

        .app-header {
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 56px;
        }

        .app-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-title h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .badge {
            background: rgba(59, 130, 246, 0.12);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 0.03em;
            text-transform: uppercase;
        }

        .badge-success {
            background: rgba(16, 185, 129, 0.12);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .badge-warning {
            background: rgba(245, 158, 11, 0.12);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .main-layout {
            display: grid;
            grid-template-columns: 440px 1fr;
            height: calc(100vh - 56px);
        }

        .sidebar {
            background: var(--bg-secondary);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
        }

        .sidebar-header {
            padding: 18px 20px 14px 20px;
            border-bottom: 1px solid var(--border);
            background: var(--bg-secondary);
            flex-shrink: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 9px 12px;
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.88rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .form-group input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Fuel Range & Stepper */
        .fuel-control {
            background: var(--bg-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .fuel-val-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--success);
            white-space: nowrap;
        }

        .fuel-slider {
            flex: 1;
            accent-color: var(--accent);
            cursor: pointer;
            height: 4px;
        }

        .btn-primary {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 14px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.45);
        }

        .btn-primary:active { transform: translateY(0); }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .spinner {
            display: none;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Scrollable Results Area */
        .sidebar-body {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .sidebar-body::-webkit-scrollbar {
            width: 5px;
        }

        .sidebar-body::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-body::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }

        /* Hero Cost Card */
        .hero-cost-card {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(19, 28, 46, 0.8) 100%);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: var(--radius);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--success-glow);
        }

        .hero-cost-label {
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 2px;
        }

        .hero-cost-amount {
            font-size: 1.85rem;
            font-weight: 800;
            color: var(--success);
            line-height: 1.1;
            letter-spacing: -0.03em;
        }

        .cpm-badge {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.25);
            border-radius: 8px;
            padding: 6px 12px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
        }

        .cpm-label {
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .cpm-val {
            font-size: 0.9rem;
            font-weight: 800;
            color: var(--success);
        }

        /* Metric Grid Chips */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .metric-title {
            font-size: 0.68rem;
            font-weight: 600;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .metric-val {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        /* Fuel Stops Section Header */
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 4px;
        }

        .section-header-title {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
        }

        /* Compact Two-Tier Stop Cards */
        .stops-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stop-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.18s ease;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .stop-card:hover {
            background: var(--bg-hover);
            border-color: var(--accent);
            transform: translateX(3px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.15);
        }

        .stop-card.active-stop {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.12);
        }

        /* Line 1: Badge, Station Name, Price */
        .stop-tier-1 {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .stop-title-group {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            flex: 1;
        }

        .stop-badge {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            color: white;
            font-size: 0.72rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .stop-badge.badge-best { background: var(--success); }
        .stop-badge.badge-high { background: var(--warning); }

        .stop-name {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stop-price-pill {
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 0.78rem;
            font-weight: 700;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .stop-price-pill.price-best {
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .stop-price-pill.price-avg {
            background: rgba(59, 130, 246, 0.15);
            color: var(--accent);
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .stop-price-pill.price-high {
            background: rgba(245, 158, 11, 0.15);
            color: var(--warning);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        /* Line 2: Single Compact Meta Details */
        .stop-tier-2 {
            font-size: 0.76rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-left: 30px;
        }

        .stop-meta-compact {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .stop-cost-bold {
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .error-box {
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 10px 12px;
            color: var(--danger);
            font-size: 0.84rem;
            display: none;
            line-height: 1.4;
        }

        .error-box.active { display: block; }

        #map {
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
        }

        /* Leaflet Popup Styling */
        .leaflet-popup-content-wrapper {
            background: var(--bg-card) !important;
            color: var(--text-primary) !important;
            border-radius: 8px !important;
            border: 1px solid var(--border) !important;
            box-shadow: var(--shadow) !important;
            padding: 4px !important;
        }

        .leaflet-popup-tip {
            background: var(--bg-card) !important;
        }

        .leaflet-popup-content {
            font-family: 'Inter', sans-serif;
            font-size: 0.82rem;
            line-height: 1.4;
            margin: 8px 10px !important;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
                grid-template-rows: auto 1fr;
            }
            .sidebar {
                height: 50vh;
            }
        }
    </style>
</head>
<body>
    <header class="app-header">
        <div class="app-title">
            <span style="font-size:1.25rem;">⛽</span>
            <h1>Fuel Route Planner</h1>
            <span class="badge">Production API</span>
        </div>
        <div style="font-size:0.75rem; color:var(--text-secondary); font-weight:500;">
            OSRM + PostGIS Core Solver
        </div>
    </header>

    <div class="main-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <form id="trip-form">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="start">Start Location</label>
                            <input type="text" id="start" name="start" value="Dallas, TX" placeholder="e.g. Dallas, TX" required />
                        </div>
                        <div class="form-group">
                            <label for="finish">Finish Location</label>
                            <input type="text" id="finish" name="finish" value="Atlanta, GA" placeholder="e.g. Atlanta, GA" required />
                        </div>
                        <div class="form-group full-width">
                            <label for="fuel">
                                <span>Starting Fuel Tank</span>
                                <span class="fuel-val-badge" id="fuel-display">50 Gal</span>
                            </label>
                            <div class="fuel-control">
                                <input type="range" id="fuel-slider" min="0" max="50" step="1" value="50" class="fuel-slider" />
                                <input type="hidden" id="fuel" name="starting_fuel_gallons" value="50" />
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-primary" id="plan-btn">
                        <span>Plan Optimal Route</span>
                        <div class="spinner" id="spinner"></div>
                    </button>
                </form>

                <div class="error-box" id="error-box" style="margin-top:10px;"></div>
            </div>

            <div class="sidebar-body" id="sidebar-body" style="display:none;">
                <!-- Hero Total Cost Card -->
                <div class="hero-cost-card">
                    <div>
                        <div class="hero-cost-label">Total Fuel Cost</div>
                        <div class="hero-cost-amount" id="hero-cost">$0.00</div>
                    </div>
                    <div class="cpm-badge">
                        <span class="cpm-label">Cost / Mile</span>
                        <span class="cpm-val" id="cost-per-mile">$0.00/mi</span>
                    </div>
                </div>

                <!-- Secondary Metrics -->
                <div class="metrics-grid">
                    <div class="metric-card">
                        <div class="metric-title">🛣️ Distance</div>
                        <div class="metric-val" id="metric-dist">—</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">⏱️ Est. Time</div>
                        <div class="metric-val" id="metric-time">—</div>
                    </div>
                    <div class="metric-card">
                        <div class="metric-title">⛽ Fuel Used</div>
                        <div class="metric-val" id="metric-fuel">—</div>
                    </div>
                </div>

                <!-- Fuel Stops Section -->
                <div>
                    <div class="section-header">
                        <span class="section-header-title">Fuel Stops Breakdown</span>
                        <span class="badge" id="stops-count">0 STOPS</span>
                    </div>
                    <div class="stops-list" id="stops-list" style="margin-top:8px;"></div>
                </div>
            </div>
        </aside>

        <div id="map"></div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>

    <script>
        // Sync fuel slider with display badge
        const fuelSlider = document.getElementById('fuel-slider');
        const fuelInput = document.getElementById('fuel');
        const fuelDisplay = document.getElementById('fuel-display');

        fuelSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            fuelInput.value = val;
            fuelDisplay.textContent = `${val} Gal`;
        });

        // Initialize map centered on USA
        const map = L.map('map', { zoomControl: true }).setView([38.5000, -96.0000], 4);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
            maxZoom: 18,
        }).addTo(map);

        let routeLayer = null;
        let markersLayer = L.layerGroup().addTo(map);
        let stationMarkersMap = {};

        // Custom Icons
        const originIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="background:#10b981;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid white;box-shadow:0 3px 8px rgba(0,0,0,0.4);">A</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14],
        });

        const destIcon = L.divIcon({
            className: 'custom-marker',
            html: '<div style="background:#ef4444;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;border:2px solid white;box-shadow:0 3px 8px rgba(0,0,0,0.4);">B</div>',
            iconSize: [28, 28],
            iconAnchor: [14, 14],
        });

        function createStationIcon(num, pinColor = '#3b82f6') {
            return L.divIcon({
                className: 'custom-marker',
                html: `<div style="background:${pinColor};color:white;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:11px;border:2px solid white;box-shadow:0 2px 8px rgba(0,0,0,0.35);">${num}</div>`,
                iconSize: [26, 26],
                iconAnchor: [13, 13],
            });
        }

        // Form Submit
        document.getElementById('trip-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const btn = document.getElementById('plan-btn');
            const spinner = document.getElementById('spinner');
            const errorBox = document.getElementById('error-box');
            const sidebarBody = document.getElementById('sidebar-body');

            btn.disabled = true;
            spinner.style.display = 'inline-block';
            errorBox.classList.remove('active');

            const payload = {
                start: document.getElementById('start').value,
                finish: document.getElementById('finish').value,
                starting_fuel_gallons: parseFloat(document.getElementById('fuel').value),
            };

            try {
                const resp = await fetch('/api/v1/trips/fuel-plan/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload),
                });

                const data = await resp.json();

                if (!resp.ok) {
                    const msg = data.error?.message || 'Failed to calculate route.';
                    throw new Error(msg);
                }

                renderResults(data);
                renderMap(data);
                sidebarBody.style.display = 'flex';

            } catch (err) {
                errorBox.textContent = err.message;
                errorBox.classList.add('active');
            } finally {
                btn.disabled = false;
                spinner.style.display = 'none';
            }
        });

        function renderResults(data) {
            const summary = data.summary;
            const stops = data.fuel_stops;

            // Hero Cost & Cost-per-mile calculation
            const totalCost = summary.total_fuel_cost_on_route_usd;
            const distMiles = data.route.distance_miles;
            const cpm = distMiles > 0 ? (totalCost / distMiles) : 0;

            document.getElementById('hero-cost').textContent = `$${totalCost.toFixed(2)}`;
            document.getElementById('cost-per-mile').textContent = `$${cpm.toFixed(3)}/mi`;

            document.getElementById('metric-dist').textContent = `${distMiles.toFixed(0)} mi`;
            document.getElementById('metric-time').textContent = `${(data.route.estimated_duration_minutes / 60).toFixed(1)} hrs`;
            document.getElementById('metric-fuel').textContent = `${summary.total_route_fuel_used_gallons.toFixed(1)} gal`;

            // Stops List
            const stopsList = document.getElementById('stops-list');
            const stopsCountBadge = document.getElementById('stops-count');
            stopsList.innerHTML = '';
            stopsCountBadge.textContent = `${stops.length} STOP${stops.length === 1 ? '' : 'S'}`;

            if (stops.length === 0) {
                stopsList.innerHTML = `
                    <div style="background:var(--bg-card); padding:12px; border-radius:8px; border:1px solid var(--border); text-align:center; font-size:0.82rem; color:var(--text-secondary);">
                        ✅ Starting tank is sufficient for this entire route without fuel stops.
                    </div>`;
                return;
            }

            // Min and Max prices for relative tinting
            const prices = stops.map(s => s.price_per_gallon);
            const minPrice = Math.min(...prices);
            const maxPrice = Math.max(...prices);

            stops.forEach(stop => {
                const price = stop.price_per_gallon;
                let priceClass = 'price-avg';
                let badgeClass = '';

                if (price === minPrice) {
                    priceClass = 'price-best';
                    badgeClass = 'badge-best';
                } else if (price === maxPrice && maxPrice !== minPrice) {
                    priceClass = 'price-high';
                    badgeClass = 'badge-high';
                }

                // Format clean address without duplicate city duplication
                let cleanLoc = `${stop.city}, ${stop.state}`;
                if (stop.address && !stop.address.toLowerCase().includes(stop.city.toLowerCase())) {
                    cleanLoc = `${stop.address} · ${cleanLoc}`;
                }

                const card = document.createElement('div');
                card.className = 'stop-card';
                card.dataset.seq = stop.sequence;
                card.innerHTML = `
                    <div class="stop-tier-1">
                        <div class="stop-title-group">
                            <div class="stop-badge ${badgeClass}">${stop.sequence}</div>
                            <div class="stop-name" title="${stop.name}">${stop.name}</div>
                        </div>
                        <div class="stop-price-pill ${priceClass}">$${price.toFixed(3)}/gal</div>
                    </div>
                    <div class="stop-tier-2">
                        <span class="stop-meta-compact">Mile ${stop.route_position_miles.toFixed(1)} · ${stop.distance_from_route_miles.toFixed(1)} mi off</span>
                        <span class="stop-cost-bold">Buy ${stop.gallons_to_buy.toFixed(1)} gal ($${stop.cost_usd.toFixed(2)})</span>
                    </div>
                `;

                // Interactive Click-to-Pan on Map
                card.addEventListener('click', () => {
                    document.querySelectorAll('.stop-card').forEach(c => c.classList.remove('active-stop'));
                    card.classList.add('active-stop');

                    if (stationMarkersMap[stop.sequence]) {
                        const marker = stationMarkersMap[stop.sequence];
                        map.flyTo(marker.getLatLng(), 11, { duration: 1.0 });
                        marker.openPopup();
                    }
                });

                stopsList.appendChild(card);
            });
        }

        function renderMap(data) {
            if (routeLayer) map.removeLayer(routeLayer);
            markersLayer.clearLayers();
            stationMarkersMap = {};

            const stops = data.fuel_stops;
            const prices = stops.map(s => s.price_per_gallon);
            const minPrice = prices.length ? Math.min(...prices) : 0;
            const maxPrice = prices.length ? Math.max(...prices) : 0;

            // Render route polyline
            const routeCoords = data.route.geometry.coordinates.map(c => [c[1], c[0]]);
            routeLayer = L.polyline(routeCoords, {
                color: '#3b82f6',
                weight: 5,
                opacity: 0.85,
                lineJoin: 'round'
            }).addTo(map);

            // Origin & Destination
            L.marker([data.origin.latitude, data.origin.longitude], { icon: originIcon })
                .bindPopup(`<strong>Origin</strong><br>${data.origin.label}`)
                .addTo(markersLayer);

            L.marker([data.destination.latitude, data.destination.longitude], { icon: destIcon })
                .bindPopup(`<strong>Destination</strong><br>${data.destination.label}`)
                .addTo(markersLayer);

            // Fuel Stops with Color-Coded Pins
            stops.forEach(stop => {
                let pinColor = '#3b82f6';
                if (stop.price_per_gallon === minPrice) pinColor = '#10b981';
                else if (stop.price_per_gallon === maxPrice && maxPrice !== minPrice) pinColor = '#f59e0b';

                const marker = L.marker([stop.location.latitude, stop.location.longitude], {
                    icon: createStationIcon(stop.sequence, pinColor)
                }).bindPopup(`
                    <strong style="color:#f8fafc;font-size:0.9rem;">${stop.name}</strong><br>
                    <span style="color:#94a3b8;font-size:0.78rem;">${stop.address}, ${stop.city}, ${stop.state}</span><br>
                    <hr style="border:0;border-top:1px solid #26334d;margin:5px 0;">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <span style="color:#10b981;font-weight:800;font-size:0.88rem;">$${stop.price_per_gallon.toFixed(3)}/gal</span>
                        <span style="font-weight:700;color:#f8fafc;">Buy ${stop.gallons_to_buy.toFixed(2)} gal</span>
                    </div>
                `).addTo(markersLayer);

                stationMarkersMap[stop.sequence] = marker;
            });

            // Fit map bounds
            map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });
        }

        // Run default load on startup
        document.getElementById('trip-form').dispatchEvent(new Event('submit'));
    </script>
</body>
</html>
